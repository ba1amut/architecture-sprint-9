# RoleBinding для ViewOnly
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view-only-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: view-only-user
  namespace: default
roleRef:
  kind: Role
  name: view-only
  apiGroup: rbac.authorization.k8s.io

---
# RoleBinding для Editor
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: editor-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: editor-user
  namespace: default
roleRef:
  kind: Role
  name: editor
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRoleBinding для Admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-binding
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: default
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io